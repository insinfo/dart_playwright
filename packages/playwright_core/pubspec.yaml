name: playwright_core
description: >-
  Engine layer of Playwright for Dart: browser registry and download, process
  transport, and the Chromium (CDP), Firefox (Juggler) and WebKit protocol
  drivers. Use the `playwright` package instead.
version: 0.1.0
repository: https://github.com/insinfo/dart_playwright
issue_tracker: https://github.com/insinfo/dart_playwright/issues

topics:
  - playwright
  - browser
  - automation
  - chromium
  - webkit

environment:
  sdk: ^3.6.2

resolution: workspace

dependencies:
  playwright_protocol: ^0.1.0
  # URL matching (globs) shared with the trace viewer: upstream keeps the same
  # code in `packages/isomorphic`.
  playwright_isomorphic: ^0.1.0
  web_socket_channel: ^3.0.0
  archive: ^4.0.0
  http: ^1.2.0
  path: ^1.9.0
  crypto: ^3.0.0
  logging: ^1.2.0
  collection: ^1.18.0
  async: ^2.11.0
  meta: ^1.9.0
  # Parses the aria snapshot templates of `toMatchAriaSnapshot`. Upstream
  # leans on the `yaml` npm package for the same job.
  yaml: ^3.1.0
  # POSIX (Linux/macOS) FFI bindings used by posix_process.dart to create the
  # fd3/fd4 FIFO pair handed to browser processes. Not loaded on Windows.
  stdlibc: ^0.1.4
  # Windows named-pipe transport (win32_process.dart, pipe_transport.dart).
  # Not loaded on POSIX.
  ffi: ^2.1.0
  win32: ^5.10.1

dev_dependencies:
  test: ^1.25.0
