name: playwright
description: >-
  Browser automation for Chromium, Firefox and WebKit, implemented natively in
  Dart. A port of Playwright that drives the browsers directly, with no Node.js
  runtime in the loop.
version: 0.1.0
repository: https://github.com/insinfo/dart_playwright
issue_tracker: https://github.com/insinfo/dart_playwright/issues

topics:
  - playwright
  - browser
  - automation
  - testing
  - e2e

environment:
  sdk: ^3.6.2

resolution: workspace

dependencies:
  playwright_core: ^0.1.0
  playwright_protocol: ^0.1.0
  args: ^2.5.0
  path: ^1.9.0
  meta: ^1.9.0

dev_dependencies:
  test: ^1.25.0
  # Reads back the recorded trace archive in the tracing tests.
  archive: ^4.0.0
  crypto: ^3.0.0
  # Decodes the screencast frames in the video tests, so "veio uma imagem"
  # is checked by a real decoder instead of by the same header parser the
  # implementation uses.
  image: ^4.5.0
