name: playwright
description: >-
  Browser automation for Chromium, Firefox and WebKit, implemented natively in
  Dart. A port of Playwright that drives the browsers directly, with no Node.js
  runtime in the loop.
version: 0.1.0
repository: https://github.com/insinfo/dart_playwright
issue_tracker: https://github.com/insinfo/dart_playwright/issues

topics:
  - playwright
  - browser
  - automation
  - testing
  - e2e

environment:
  sdk: ^3.6.2

resolution: workspace

dependencies:
  playwright_core: ^0.1.0
  playwright_protocol: ^0.1.0
  args: ^2.5.0
  path: ^1.9.0
  meta: ^1.9.0

dev_dependencies:
  test: ^1.25.0
