name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push cancels in-progress runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Note on `dart format`: the gate below is pinned to one exact SDK, on
# purpose. The formatter's output changes between Dart releases -- 3.7
# rewrote the style wholesale -- so the same tree cannot satisfy two SDKs at
# once, and a gate in a matrix would be red forever no matter how the code is
# formatted. 3.6.2 is the minimum the packages declare, which is the one
# version every contributor must already be able to run.

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Analyze packages
        run: dart analyze packages

  format:
    name: Format
    needs: analyze
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned, not `stable`: see the note above the jobs.
          sdk: 3.6.2
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  docs:
    name: Docs
    needs: analyze
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      # `dart doc` exits 0 even when it emits warnings, so the exit code alone
      # would prove nothing. Read the summary line instead.
      - name: Generate docs and require a clean run
        run: |
          set -euo pipefail
          status=0
          for package in playwright playwright_core playwright_protocol playwright_mcp playwright_test; do
            echo "::group::dart doc $package"
            output=$(cd "packages/$package" && dart doc --output ../../.dart_doc/"$package" 2>&1) || status=1
            echo "$output"
            echo "::endgroup::"
            if ! grep -q 'Found 0 warnings and 0 errors' <<<"$output"; then
              echo "::error::dart doc reported warnings or errors for $package"
              status=1
            fi
          done
          exit $status

  publish-dry-run:
    name: Publish dry run
    needs: analyze
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Dry run every publishable package
        run: |
          set -euo pipefail
          for package in playwright_protocol playwright_core playwright playwright_mcp playwright_test; do
            echo "::group::dart pub publish --dry-run $package"
            (cd "packages/$package" && dart pub publish --dry-run)
            echo "::endgroup::"
          done

  test:
    name: E2E ${{ matrix.os }}
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: avoids the 24.04 AppArmor restriction on the Chromium
        # sandbox. macos-15: matches the webkit-mac-15 build in the registry.
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('packages/playwright_core/lib/src/registry/browsers_json.dart') }}

      - name: Install browser system dependencies (Linux)
        if: runner.os == 'Linux'
        # System libraries only (revision-agnostic); browser binaries come
        # from our own Dart registry in the next step.
        run: npx --yes playwright install-deps chromium firefox webkit

      - name: Install browsers
        working-directory: packages/playwright
        run: dart run playwright install chromium firefox webkit

      # The whole parity suite, on all three engines. A bare `dart test` at the
      # workspace root picks nothing up, so the test directories are named.
      - name: Run the parity suite on Chromium, Firefox and WebKit
        env:
          # Surface browser stdout/stderr in the POSIX launcher for diagnosis.
          PLAYWRIGHT_DEBUG: '1'
        run: dart test packages/playwright/test packages/playwright_core/test packages/playwright_mcp/test packages/playwright_test/test --reporter expanded --timeout 180s
